<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牢门条约 - 第一代</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>牢门条约</h1>
        <div class="date">颁布日期：2025年4月28日</div>
    </header>

    <main>
        <section class="treaty">
            <h2>条约内容</h2>
            <ol class="clauses">
                <li>牢曾下课时不能大吼大叫，必须安静文雅。</li>
                <li>牢曾不能攻击其他同学。（包括不能威胁）</li>
                <li>牢曾必须答应我们的一些合理要求。</li>
                <li>牢曾不能强制同桌做事情。</li>
                <li>牢曾不能说梗语，如："那咋了？"</li>
            </ol>
        </section>

        <section class="notice">
            <h3>注意事项</h3>
            <p>当牢曾换座位后，从牢门条约71将传给下一代牢门之首。（及牢曾换座位的新闻录）</p>
        </section>

        <section class="members">
            <h2>牢门第一代</h2>
            <dl class="member-list">
                <div class="member-item">
                    <dt>牢门之首</dt>
                    <dd>陈晓星</dd>
                </div>
                <div class="member-item">
                    <dt>上门</dt>
                    <dd>王帅</dd>
                </div>
                <div class="member-item">
                    <dt>中门</dt>
                    <dd>陈欣燚</dd>
                </div>
                <div class="member-item">
                    <dt>下门</dt>
                    <dd>曾钰雯</dd>
                </div>
            </dl>
        </section>

        <section class="inheritance">
            <p>传承时间：直到毕业</p>
            <p class="warning">（若违反条约，将被出一定惩罚！）</p>
            <p class="explanation">最终解释权归牢门之首、上门、中门所有。</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
